name: Publish macOS Release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Actions run ID containing the macOS DMG artifacts"
        required: true
        default: "30713528029"
        type: string
      tag:
        description: "Release tag to create"
        required: true
        default: "v1.0"
        type: string
      target_ref:
        description: "Branch or commit to tag when the release tag does not exist"
        required: true
        default: "main"
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Download Apple Silicon DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets/arm
          gh run download "${{ inputs.source_run_id }}" \
            --repo "${{ github.repository }}" \
            --name macOS-arm-swiftui \
            --dir release-assets/arm

      - name: Download Intel DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets/intel
          gh run download "${{ inputs.source_run_id }}" \
            --repo "${{ github.repository }}" \
            --name macOS-intel-swiftui \
            --dir release-assets/intel

      - name: Validate release assets
        run: |
          test -s release-assets/arm/macOS-arm-swiftui.dmg
          test -s release-assets/intel/macOS-intel-swiftui.dmg
          sha256sum \
            release-assets/arm/macOS-arm-swiftui.dmg \
            release-assets/intel/macOS-intel-swiftui.dmg

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" \
            release-assets/arm/macOS-arm-swiftui.dmg \
            release-assets/intel/macOS-intel-swiftui.dmg \
            --repo "${{ github.repository }}" \
            --target "${{ inputs.target_ref }}" \
            --title "TeleShield ${{ inputs.tag }}" \
            --generate-notes
